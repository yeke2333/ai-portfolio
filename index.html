<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="个人作品集。在线体验人生一页、暗夜幸存者与雨夜便利店三个互动作品。">
  <meta name="theme-color" content="#f8f9f4">
  <title>作品集</title>
  <link rel="icon" href="./assets/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./assets/portfolio.css?v=3">
</head>
<body>
  <header class="site-header" id="top">
    <div class="shell header-inner">
      <a class="brand" href="./"><img src="./assets/mark.svg" alt="" width="32" height="32"> 作品集</a>
      <nav aria-label="项目导航">
        <a href="#more-title">更多作品 <span aria-hidden="true">↓</span></a>
      </nav>
    </div>
  </header>

  <main class="shell">
    <section class="showcase" aria-labelledby="portfolio-title">
      <div class="showcase-copy">
        <p class="eyebrow"><span class="status-dot" aria-hidden="true"></span> 可在线体验</p>
        <h1 id="portfolio-title">作品集</h1>
        <p class="lead">三个可在线体验的网页作品，涵盖叙事模拟、像素游戏与互动三维场景。</p>

        <article class="featured" aria-labelledby="life-title">
          <p class="project-type">主打作品 <span aria-hidden="true">/</span> 人生模拟</p>
          <h2 id="life-title">人生一页</h2>
          <p>从出生开始，做出上学、工作与成家的抉择。查看家人与同龄人的档案，翻阅每一年的人生记录。</p>
          <a class="primary-action" href="./life/" aria-label="试玩人生一页">开始一段人生 <span aria-hidden="true">↗</span></a>
        </article>
      </div>

      <a class="feature-art" href="./life/" aria-label="进入人生一页游戏">
        <div class="feature-art-top"><span class="preview-dots" aria-hidden="true"><i></i><i></i><i></i></span><span>游戏实景</span></div>
        <img src="./assets/life.webp" width="1200" height="498" alt="傍晚的像素街道上，一家人站在亮灯的楼房前" fetchpriority="high">
        <div class="feature-art-bottom"><span>LIFE IN PAGES</span><span class="image-arrow" aria-hidden="true">↗</span></div>
      </a>
    </section>

    <section class="more-projects" aria-labelledby="more-title">
      <div class="section-heading">
        <h2 id="more-title">更多作品</h2>
      </div>
      <div class="project-grid">
        <article class="project" aria-labelledby="survival-title">
          <a class="project-link" href="./game/">
            <div class="project-art survival-art">
              <img src="./assets/survival.webp" alt="暗夜幸存者的像素战斗画面" width="900" height="520" decoding="async">
            </div>
            <div class="project-copy">
              <p class="project-type">像素动作 <span aria-hidden="true">/</span> 类吸血鬼幸存者</p>
              <h3 id="survival-title">暗夜幸存者</h3>
              <p>在五分钟内躲避敌群、升级武器，迎战血月领主。</p>
              <span class="project-action">开始试炼 <span aria-hidden="true">↗</span></span>
            </div>
          </a>
        </article>
        <article class="project" aria-labelledby="konbini-title">
          <a class="project-link" href="./konbini/">
            <div class="project-art konbini-art">
              <img src="./assets/konbini.webp" alt="灯光照亮雨中的日式街角便利店" width="900" height="520" decoding="async">
            </div>
            <div class="project-copy">
              <p class="project-type">互动三维 <span aria-hidden="true">/</span> THREE.JS</p>
              <h3 id="konbini-title">雨夜便利店</h3>
              <p>旋转、缩放一座雨夜街角的微缩场景，看看灯光、路面倒影和店内陈设。</p>
              <span class="project-action">探索场景 <span aria-hidden="true">↗</span></span>
            </div>
          </a>
        </article>
      </div>
    </section>
  </main>

  <footer class="shell footer"><span>作品集</span><a href="#top">回到顶部 <span aria-hidden="true">↑</span></a></footer>
</body>
</html>
